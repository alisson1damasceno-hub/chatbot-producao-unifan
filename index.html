<!DOCTYPE html>
<html lang="pt-br" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chatbot - Produção Unifan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; transition: background 0.3s, color 0.3s; }

    :root[data-theme="light"] {
      --bg-page:         #f7f7f8;
      --bg-chat:         #ffffff;
      --bg-msg-bot:      #f1f1f1;
      --bg-input:        #ffffff;
      --color-text:      #1a1a1a;
      --color-prim:      #2d6a4f;
      --color-prim-dark: #1b4332;
      --border:          #e0e0e0;
      --msg-user-text:   #ffffff;
      --btn-bg:          #eaf4ef;
      --btn-border:      #b7dfc9;
      --btn-text:        #2d6a4f;
      --header-bg:       #ffffff;
      --header-border:   #e0e0e0;
    }

    :root[data-theme="dark"] {
      --bg-page:         #0f1117;
      --bg-chat:         #0f1117;
      --bg-msg-bot:      #1e2030;
      --bg-input:        #1e2030;
      --color-text:      #e8e8e8;
      --color-prim:      #40916c;
      --color-prim-dark: #2d6a4f;
      --border:          #2a2d3e;
      --msg-user-text:   #ffffff;
      --btn-bg:          #1e2d25;
      --btn-border:      #40916c;
      --btn-text:        #74c69d;
      --header-bg:       #1a1d27;
      --header-border:   #2a2d3e;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg-page);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── Header fixo no topo ── */
    .chat-header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--header-border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .chat-header-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .chat-header-title .logo {
      background: var(--color-prim);
      color: white;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .chat-header-title .titulo {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text);
    }

    .chat-header-title .subtitulo {
      font-size: 12px;
      color: var(--color-text);
      opacity: 0.5;
    }

    .theme-toggle {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--btn-text);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Segoe UI', sans-serif;
    }
    .theme-toggle:hover { background: var(--color-prim); color: white; border-color: var(--color-prim); }

    /* ── Área de mensagens ── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    .message-wrap {
      width: 100%;
      max-width: 680px;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
    }

    .message-wrap.user { align-items: flex-end; }
    .message-wrap.bot  { align-items: flex-start; }

    .message {
      max-width: 85%;
      padding: 11px 16px;
      border-radius: 14px;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .message.bot {
      background: var(--bg-msg-bot);
      color: var(--color-text);
      border-bottom-left-radius: 4px;
    }

    .message.user {
      background: var(--color-prim);
      color: var(--msg-user-text);
      border-bottom-right-radius: 4px;
    }

    /* ── Sugestões iniciais ── */
    .sugestoes-wrap {
      width: 100%;
      max-width: 680px;
      padding: 0 24px;
    }

    .sugestoes-label {
      font-size: 12px;
      color: var(--color-text);
      opacity: 0.45;
      margin-bottom: 8px;
    }

    .sugestoes-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-sugestao {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--btn-text);
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Segoe UI', sans-serif;
    }
    .btn-sugestao:hover { background: var(--color-prim); color: white; border-color: var(--color-prim); }

    /* ── Botões de tecido ── */
    .tecidos-wrap {
      width: 100%;
      max-width: 680px;
      padding: 0 24px;
    }

    .tecidos-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-tecido {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--btn-text);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      font-family: 'Segoe UI', sans-serif;
    }
    .btn-tecido:hover { background: var(--color-prim); color: white; border-color: var(--color-prim); }
    .btn-tecido .icone { font-size: 18px; }

    /* ── Input fixo no fundo ── */
    .chat-input-area {
      border-top: 1px solid var(--border);
      background: var(--bg-page);
      padding: 16px 24px 20px;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
    }

    .chat-input {
      width: 100%;
      max-width: 680px;
      display: flex;
      gap: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px 8px 8px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .chat-input input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
      background: transparent;
      color: var(--color-text);
      font-family: 'Segoe UI', sans-serif;
    }

    .chat-input button {
      background: var(--color-prim);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 18px;
      cursor: pointer;
      font-size: 14px;
      font-family: 'Segoe UI', sans-serif;
      min-height: 38px;
    }
    .chat-input button:hover { background: var(--color-prim-dark); }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      .chat-messages { padding: 16px 0; }
      .message-wrap, .sugestoes-wrap, .tecidos-wrap { padding: 0 12px; }
      .chat-input-area { padding: 10px 12px 16px; }
      .message { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="chat-header">
    <div class="chat-header-title">
      <div class="logo">🌿</div>
      <div>
        <div class="titulo">Chatbot Produção Unifan</div>
        <div class="subtitulo">Assistente virtual</div>
      </div>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()">
      <span id="theme-icon">🌙</span>
      <span id="theme-label">Escuro</span>
    </button>
  </div>

  <div class="chat-messages" id="messages"></div>

  <div class="chat-input-area">
    <div class="chat-input">
      <input type="text" id="input" placeholder="Digite sua mensagem..." />
      <button onclick="enviar()">Enviar</button>
    </div>
  </div>

  <script>
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");
    const html = document.documentElement;

    const tecidos = [
      { label: "Algodão",   icone: "🌿", valor: "algodão"   },
      { label: "Linho",     icone: "🌾", valor: "linho"     },
      { label: "Seda",      icone: "✨", valor: "seda"      },
      { label: "Sintético", icone: "🧵", valor: "sintético" },
      { label: "Lã",        icone: "🐑", valor: "lã"        },
    ];

    const sugestoesIniciais = [
      { label: "🧺 Como cuidar das peças?", valor: "quero saber sobre manutenção" },
      { label: "🎨 Personalização",          valor: "personalizar" },
      { label: "⭐ Qualidade",               valor: "qualidade" },
    ];

    input.addEventListener("keydown", e => { if (e.key === "Enter") enviar(); });

    function toggleTheme() {
      const atual = html.getAttribute("data-theme");
      const novo = atual === "light" ? "dark" : "light";
      html.setAttribute("data-theme", novo);
      document.getElementById("theme-icon").textContent = novo === "dark" ? "☀️" : "🌙";
      document.getElementById("theme-label").textContent = novo === "dark" ? "Claro" : "Escuro";
    }

    function adicionarMensagem(texto, tipo) {
      const wrap = document.createElement("div");
      wrap.classList.add("message-wrap", tipo);
      const div = document.createElement("div");
      div.classList.add("message", tipo);
      div.textContent = texto;
      wrap.appendChild(div);
      messages.appendChild(wrap);
      messages.scrollTop = messages.scrollHeight;
    }

    function mostrarSugestoesIniciais() {
      adicionarMensagem("Olá! Como posso ajudar você hoje?", "bot");

      const wrap = document.createElement("div");
      wrap.classList.add("sugestoes-wrap");

      const label = document.createElement("div");
      label.classList.add("sugestoes-label");
      label.textContent = "Sugestões:";
      wrap.appendChild(label);

      const grid = document.createElement("div");
      grid.classList.add("sugestoes-grid");

      sugestoesIniciais.forEach(s => {
        const btn = document.createElement("button");
        btn.classList.add("btn-sugestao");
        btn.textContent = s.label;
        btn.onclick = () => { wrap.remove(); enviarTexto(s.valor); };
        grid.appendChild(btn);
      });

      wrap.appendChild(grid);
      messages.appendChild(wrap);
      messages.scrollTop = messages.scrollHeight;
    }

    function mostrarBotoesTecido() {
      const wrap = document.createElement("div");
      wrap.classList.add("tecidos-wrap");

      const grid = document.createElement("div");
      grid.classList.add("tecidos-grid");

      tecidos.forEach(t => {
        const btn = document.createElement("button");
        btn.classList.add("btn-tecido");
        btn.innerHTML = `<span class="icone">${t.icone}</span>${t.label}`;
        btn.onclick = () => { wrap.remove(); enviarTexto(t.valor); };
        grid.appendChild(btn);
      });

      wrap.appendChild(grid);
      messages.appendChild(wrap);
      messages.scrollTop = messages.scrollHeight;
    }

    async function enviarTexto(texto) {
      // Remove botões de tecido pendentes se existirem
      const tecidosPendentes = document.querySelector(".tecidos-wrap");
      if (tecidosPendentes) tecidosPendentes.remove();

      adicionarMensagem(texto, "user");

      const resposta = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mensagem: texto })
      });

      const dados = await resposta.json();
      adicionarMensagem(dados.resposta, "bot");

      if (dados.resposta.includes("tipo de tecido")) {
        mostrarBotoesTecido();
      }
    }

    async function enviar() {
      const texto = input.value.trim();
      if (!texto) return;
      input.value = "";
      await enviarTexto(texto);
    }

    mostrarSugestoesIniciais();
  </script>
</body>
</html>
