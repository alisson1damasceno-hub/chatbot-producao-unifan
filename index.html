<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chatbot - Produção Unifan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 420px;
      height: 600px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #2d6a4f;
      color: white;
      padding: 18px 20px;
      font-size: 16px;
      font-weight: 600;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .message.bot {
      background: #f1f1f1;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .message.user {
      background: #2d6a4f;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .chat-input {
      display: flex;
      padding: 12px;
      border-top: 1px solid #eee;
      gap: 8px;
    }

    .chat-input input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 24px;
      outline: none;
      font-size: 14px;
    }

    .chat-input input:focus {
      border-color: #2d6a4f;
    }

    .chat-input button {
      background: #2d6a4f;
      color: white;
      border: none;
      border-radius: 24px;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 14px;
    }

    .chat-input button:hover {
      background: #1b4332;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">🌿 Chatbot Produção Unifan</div>
    <div class="chat-messages" id="messages">
      <div class="message bot">Olá! Como posso ajudar você hoje?</div>
    </div>
    <div class="chat-input">
      <input type="text" id="input" placeholder="Digite sua mensagem..." />
      <button onclick="enviar()">Enviar</button>
    </div>
  </div>

  <script>
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");

    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") enviar();
    });

    async function enviar() {
      const texto = input.value.trim();
      if (!texto) return;

      adicionarMensagem(texto, "user");
      input.value = "";

      const resposta = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mensagem: texto })
      });

      const dados = await resposta.json();
      adicionarMensagem(dados.resposta, "bot");
    }

    function adicionarMensagem(texto, tipo) {
      const div = document.createElement("div");
      div.classList.add("message", tipo);
      div.textContent = texto;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
